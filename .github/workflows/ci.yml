name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test:e2e
      - run: pnpm build

  # Hiring evidence: production Worker health (workers.dev is authoritative).
  # roomy.page may 403 GitHub Actions IPs (Cloudflare); probed best-effort.
  prod-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Probe workers.dev health (required)
        run: |
          set -euo pipefail
          body=$(curl -fsS "https://roomy-page-workbench.hommy.workers.dev/workbench/api/health")
          echo "$body"
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"sse":true'
          echo "$body" | grep -q '"kv":true'
          echo "$body" | grep -q '"ai":true'
      - name: Probe roomy.page health (best-effort)
        continue-on-error: true
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "https://roomy.page/workbench/api/health")
          echo "HTTP $code"
          cat /tmp/health.json || true
          test "$code" = "200"
          grep -q '"ok":true' /tmp/health.json
