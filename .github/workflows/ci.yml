name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test:e2e
      - run: pnpm build

  # Hiring evidence: production Worker health (workers.dev is authoritative).
  # roomy.page may 403 GitHub Actions IPs (Cloudflare); probed best-effort.
  prod-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Probe workers.dev health (required)
        run: |
          set -euo pipefail
          body=$(curl -fsS "https://roomy-page-workbench.hommy.workers.dev/workbench/api/health")
          echo "$body"
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"sse":true'
          echo "$body" | grep -q '"kv":true'
          echo "$body" | grep -q '"ai":true'
          echo "$body" | grep -q '"protocol":"/workbench/api/protocol"'
          echo "$body" | grep -q '"maxActiveStreams":8'
          proto=$(curl -fsS "https://roomy-page-workbench.hommy.workers.dev/workbench/api/protocol")
          echo "$proto" | head -c 500
          echo
          echo "$proto" | grep -q '"workersAiStructuring":"workers-ai-struct-v3"'
          echo "$proto" | grep -q '"workersAiPatchPlan":"workers-ai-patch-v1"'
          echo "$proto" | grep -q 'metrics.sample'
          echo "$proto" | grep -q 'tool.args_edited'
      - name: Probe roomy.page health (best-effort)
        continue-on-error: true
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "https://roomy.page/workbench/api/health")
          echo "HTTP $code"
          cat /tmp/health.json || true
          test "$code" = "200"
          grep -q '"ok":true' /tmp/health.json
      - name: Workers AI structuring smoke (required)
        run: |
          set -euo pipefail
          key="ci-ai-$(date +%s)"
          curl -fsSN -X POST \
            "https://roomy-page-workbench.hommy.workers.dev/workbench/api/runs/stream" \
            -H "Content-Type: application/json" \
            --data "{\"scenarioId\":\"rw-004\",\"fixture\":\"happy_card_grid\",\"idempotencyKey\":\"$key\",\"mode\":\"workers-ai\",\"sourceText\":\"desktop 3 columns mobile 1 column CTA detail\"}" \
            --max-time 60 \
            -o /tmp/ai-sse.txt
          # Show a short excerpt for the Actions log
          head -c 2000 /tmp/ai-sse.txt || true
          echo
          grep -q '"mode":"workers-ai"' /tmp/ai-sse.txt
          grep -q '"type":"requirements.ready"' /tmp/ai-sse.txt
          grep -q '"type":"metrics.sample"' /tmp/ai-sse.txt
          grep -q '"provider":"workers-ai"' /tmp/ai-sse.txt
          grep -q '"promptVersion":"workers-ai-struct-v3"' /tmp/ai-sse.txt
          grep -E -q '"tokens":[1-9][0-9]*' /tmp/ai-sse.txt
      - name: Workers AI hybrid patch-plan smoke (required)
        run: |
          set -euo pipefail
          key="ci-hybrid-$(date +%s)"
          hdr=$(mktemp)
          body=$(mktemp)
          printf '%s' "{\"scenarioId\":\"rw-004\",\"fixture\":\"happy_card_grid\",\"idempotencyKey\":\"$key\",\"mode\":\"workers-ai\",\"sourceText\":\"desktop 3 columns mobile 1 column CTA detail\"}" > "$body"
          curl -fsSN -X POST \
            "https://roomy-page-workbench.hommy.workers.dev/workbench/api/runs/stream" \
            -H "Content-Type: application/json" \
            --data-binary @"$body" \
            --max-time 60 \
            -D "$hdr" \
            -o /tmp/hybrid-struct.txt
          run_id=$(grep -i '^X-Run-Id:' "$hdr" | awk '{print $2}' | tr -d '\r')
          test -n "$run_id"
          grep -q '"mode":"workers-ai"' /tmp/hybrid-struct.txt
          grep -q '"type":"requirements.ready"' /tmp/hybrid-struct.txt
          curl -fsSN -X POST \
            "https://roomy-page-workbench.hommy.workers.dev/workbench/api/runs/${run_id}/continue" \
            -H "Content-Type: application/json" \
            --data '{"action":"approve"}' \
            --max-time 90 \
            -o /tmp/hybrid-exec.txt
          head -c 2500 /tmp/hybrid-exec.txt || true
          echo
          grep -q '"type":"plan.approved"' /tmp/hybrid-exec.txt
          grep -q '"name":"propose_patch_plan"' /tmp/hybrid-exec.txt
          grep -q '"type":"tool.finished"' /tmp/hybrid-exec.txt
          snap=$(curl -fsS "https://roomy-page-workbench.hommy.workers.dev/workbench/api/runs/${run_id}")
          echo "$snap"
          echo "$snap" | grep -q '"mode":"workers-ai"'
          echo "$snap" | grep -q 'propose_patch_plan'
          echo "$snap" | grep -q '"toolNames"'
